name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server-rs -> target
            desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm run build:shared

      - name: Test web
        run: npm test -w @moon/web

      # zcode 适配器测试需要一份 provider 配置；CI 用最小桩文件，
      # 避免测试依赖 runner 上并不存在的本机 zcode 配置。
      - name: Provide ZCode provider config stub
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "zcode-provider-config.json"
          [System.IO.File]::WriteAllText($path, '{"config":{}}', [System.Text.UTF8Encoding]::new($false))
          "ZCODE_PERSONAL_PROVIDER_CONFIG_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test Rust backend
        run: npm run test:rust

      - name: Build desktop installer
        run: npm run desktop:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: moon-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
