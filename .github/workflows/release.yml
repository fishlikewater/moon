name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server-rs -> target
            desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches versions
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $packageVersion = (Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $tauriVersion = (Get-Content desktop/src-tauri/tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          if ($tag -ne "v$packageVersion") {
            throw "标签 $tag 与 package.json 版本 v$packageVersion 不一致"
          }
          if ($tag -ne "v$tauriVersion") {
            throw "标签 $tag 与 tauri.conf.json 版本 v$tauriVersion 不一致"
          }

      - name: Test web
        run: npm test

      - name: Build desktop installer
        run: npm run desktop:build

      - name: Generate checksum
        shell: pwsh
        run: |
          $bundle = "desktop/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path "$bundle/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "未找到 NSIS 安装包：$bundle"
          }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Out-File -FilePath "$bundle/SHA256.txt" -Encoding utf8
          "installer=$($installer.Name)"
          "sha256=$hash"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $bundle = "desktop/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path "$bundle/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "未找到 NSIS 安装包：$bundle"
          }
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer.FullName "$bundle/SHA256.txt" --clobber
          } else {
            gh release create "$tag" --title "$tag" --generate-notes $installer.FullName "$bundle/SHA256.txt"
          }
